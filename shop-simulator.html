<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Симулятор магазина</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;font:16px system-ui;color:#fff}canvas{display:block}#help{position:fixed;left:16px;top:14px;padding:12px 16px;background:#101820cc;border:1px solid #ffffff30;border-radius:12px;line-height:1.55;pointer-events:none}#hint{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 16px;border-radius:20px;background:#101820cc;opacity:0;transition:.2s}#hint.on{opacity:1}#touch{display:none;position:fixed;inset:auto 0 24px;justify-content:space-between;padding:0 24px;pointer-events:none}.pad{pointer-events:auto;width:116px;height:116px;border-radius:50%;background:#ffffff20;border:1px solid #fff7;display:grid;place-items:center;touch-action:none}.stick{width:42px;height:42px;border-radius:50%;background:#ffffffaa}.btn{position:fixed;right:26px;bottom:52px;width:72px;height:72px;border:0;border-radius:50%;background:#ffcf5a;color:#202020;font-weight:bold;display:none}@media(pointer:coarse){#touch{display:flex}.btn{display:block}}</style>
</head>
<body><div id="help"><b>СИМУЛЯТОР МАГАЗИНА</b><div id="stats">Баланс: 500 ₽ · День: 1 · Покупатели: 0</div><small>WASD — движение · мышь — обзор · E — взаимодействие</small></div><div id="hint"></div><div id="touch"><div class="pad" id="move"><div class="stick"></div></div><div class="pad" id="look"><div class="stick"></div></div></div><button class="btn" id="interact">E</button>
<script type="module">
import * as THREE from 'https://unpkg.com/three@0.166.1/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9caeb8);scene.fog=new THREE.Fog(0x9caeb8,18,42);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,100);camera.position.set(0,1.7,7);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe4f1ff,0x514539,2));const sun=new THREE.DirectionalLight(0xffedc4,2.4);sun.position.set(-5,9,7);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
function box(x,y,z,w,h,d,color,rough=.75,metal=0){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal}));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}
box(0,-.12,0,28,.24,20,0xbeb9b1,.25,.08);box(0,2.5,-10,28,5,.25,0xe5ddd2);box(-14,2.5,0,.25,5,20,0xe5ddd2);box(14,2.5,0,.25,5,20,0xe5ddd2);box(0,5,0,28,.18,20,0xf2eee6);
for(let x=-9;x<=9;x+=6){box(x,4.87,-1,2.4,.08,1.2,0xfff0b5,.25);const l=new THREE.PointLight(0xffe6aa,28,14);l.position.set(x,4.2,-1);scene.add(l)}
function shelf(x,z){box(x,1.25,z,2.6,2.5,.9,0x656c70,.45,.55);for(let y of [.5,1.25,2])box(x,y,z+.48,2.7,.07,1.05,0xb3b6b5,.35,.45);for(let row=0;row<3;row++)for(let n=0;n<5;n++){const colors=[0xd95f59,0x63a88d,0xe3b44f,0x6293c5,0xd7d0bc];const item=box(x-1+n*.48,.78+row*.7,z+.5,.32,.45,.32,colors[(n+row)%5],.55);item.userData={product:true,name:['Хлеб','Молоко','Чай','Кофе','Печенье'][(n+row)%5],price:50+(n+row)*15}}}
for(let x of [-9,-3,3,9])shelf(x,-3);
for(let x of [-11,11]){box(x,1.5,4,2.3,3,.9,0xd9e1e4,.2,.7);for(let y=.6;y<2.8;y+=.6)box(x,y,4.48,1.8,.035,.025,0x9ce5ff,.12,.1)}
box(0,.65,7,3.8,1.3,1.5,0x826b55);box(0,1.34,7,1.2,.08,.8,0x333b40,.2,.5);box(.6,1.62,6.65,.65,.42,.05,0x192a34,.12,.2);
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e')interact()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let yaw=0,pitch=0,locked=false;renderer.domElement.addEventListener('click',()=>{if(!matchMedia('(pointer:coarse)').matches)renderer.domElement.requestPointerLock()});addEventListener('pointerlockchange',()=>locked=!!document.pointerLockElement);addEventListener('mousemove',e=>{if(locked){yaw-=e.movementX*.002;pitch=Math.max(-1,Math.min(1,pitch-e.movementY*.002))}});
let cash=500,customers=0;const stat=document.querySelector('#stats'),hint=document.querySelector('#hint');function say(s){hint.textContent=s;hint.classList.add('on');setTimeout(()=>hint.classList.remove('on'),1600)}
function interact(){const dir=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw));const ray=new THREE.Raycaster(camera.position,dir,0,2.5);const hits=ray.intersectObjects(scene.children);const h=hits.find(v=>v.object.userData.product);if(h){cash+=h.object.userData.price;customers++;h.object.visible=false;stat.textContent=`Баланс: ${cash} ₽ · День: ${1+Math.floor(customers/8)} · Покупатели: ${customers}`;say(`${h.object.userData.name} продан · +${h.object.userData.price} ₽`)}else say('Подойдите к товару и нажмите E')}
document.querySelector('#interact').onclick=interact;
let moveTouch={x:0,y:0},lookTouch=null;function pad(id,fn){const el=document.getElementById(id);el.addEventListener('touchstart',e=>{e.preventDefault();fn('start',e.touches[0],el)}, {passive:false});el.addEventListener('touchmove',e=>{e.preventDefault();fn('move',e.touches[0],el)}, {passive:false});el.addEventListener('touchend',()=>fn('end',null,el))}pad('move',(type,t,el)=>{const s=el.querySelector('.stick');if(type==='end'){moveTouch={x:0,y:0};s.style.transform='';return}const r=el.getBoundingClientRect(),dx=t.clientX-(r.left+r.width/2),dy=t.clientY-(r.top+r.height/2),len=Math.max(1,Math.hypot(dx,dy)),x=dx/len*Math.min(36,len),y=dy/len*Math.min(36,len);s.style.transform=`translate(${x}px,${y}px)`;moveTouch={x:x/36,y:y/36}});pad('look',(type,t,el)=>{const s=el.querySelector('.stick');if(type==='end'){lookTouch=null;s.style.transform='';return}const r=el.getBoundingClientRect();if(type==='start')lookTouch={x:t.clientX,y:t.clientY};else if(lookTouch){yaw-=(t.clientX-lookTouch.x)*.006;pitch=Math.max(-1,Math.min(1,pitch-(t.clientY-lookTouch.y)*.005));lookTouch={x:t.clientX,y:t.clientY};s.style.transform=`translate(${Math.max(-30,Math.min(30,t.clientX-(r.left+r.width/2)))}px,${Math.max(-30,Math.min(30,t.clientY-(r.top+r.height/2)))}px)`}});
const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.04),f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0)-moveTouch.y,r=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+moveTouch.x;camera.position.x+=Math.sin(yaw)*f*dt*4+Math.cos(yaw)*r*dt*4;camera.position.z+=Math.cos(yaw)*f*dt*4-Math.sin(yaw)*r*dt*4;camera.position.x=THREE.MathUtils.clamp(camera.position.x,-12.8,12.8);camera.position.z=THREE.MathUtils.clamp(camera.position.z,-8.7,8.7);camera.rotation.order='YXZ';camera.rotation.set(pitch,yaw,0);renderer.render(scene,camera)}frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
